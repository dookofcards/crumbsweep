name: Release

# Push a tag like v0.5.2 to release. The tag is the approval: everything after
# it runs unattended, and the update goes live once Chrome Web Store review
# passes. Run manually (Actions → Release → Run workflow) for a dry run that
# checks credentials and the package but uploads nothing.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CWS_EXTENSION_ID: kohfndmjmmfbmkiagfndfoglpimiaman

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check tag, package.json and CHANGELOG agree
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1
          fi
          grep -q "^## $version " CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $version' entry"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # CI is set by Actions, so the live ExtensionPay checkout test is skipped.
      - run: xvfb-run --auto-servernum node tools/e2e.mjs

  release:
    needs: verify
    runs-on: ubuntu-latest
    environment: chrome-web-store
    permissions:
      contents: write # for the GitHub Release
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      DRY_RUN: ${{ github.ref_type != 'tag' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Upload to Chrome Web Store and submit for review
        env:
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          node tools/cws.mjs release --zip "crumbsweep-v$VERSION.zip" \
            $([ "$DRY_RUN" = "true" ] && echo --dry-run)
      - name: Publish GitHub Release with the exact zip that was uploaded
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## " v " " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "v$VERSION" "crumbsweep-v$VERSION.zip" \
            --title "CrumbSweep $VERSION" --notes-file notes.md --verify-tag
